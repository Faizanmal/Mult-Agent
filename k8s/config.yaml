---
apiVersion: v1
kind: Secret
metadata:
  name: multi-agent-secrets
type: Opaque
stringData:
  # Database
  database-url: "postgresql://username:password@postgres-host:5432/multi_agent_db"
  
  # Redis
  redis-url: "redis://redis-service:6379/0"
  
  # AI Model APIs
  groq-api-key: "your-groq-api-key"
  openai-api-key: "your-openai-api-key"
  anthropic-api-key: "your-anthropic-api-key"
  
  # Azure Services
  azure-cosmosdb-endpoint: "https://your-account.documents.azure.com:443/"
  azure-cosmosdb-key: "your-cosmosdb-key"
  azure-functions-url: "https://your-function-app.azurewebsites.net"
  azure-functions-key: "your-function-key"
  
  # Notification Services
  twilio-account-sid: "your-twilio-sid"
  twilio-auth-token: "your-twilio-token"
  twilio-phone-number: "+1234567890"
  firebase-server-key: "your-firebase-server-key"
  
  # Workflow Automation
  zapier-webhook-url: "https://hooks.zapier.com/hooks/catch/your-hook"
  zapier-api-key: "your-zapier-api-key"
  make-webhook-url: "https://hook.make.com/your-hook"
  make-api-token: "your-make-token"
  
  # JWT/OAuth2
  jwt-secret-key: "your-secret-key-change-in-production"
  jwt-algorithm: "HS256"
  
  # GDPR Encryption
  encryption-key: "your-fernet-encryption-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-agent-config
data:
  # Application Settings
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://your-domain.com"
  
  # Cache Settings
  CACHE_TTL: "3600"
  REDIS_MAX_CONNECTIONS: "50"
  
  # Model Settings
  DEFAULT_MODEL_PROVIDER: "groq"
  DEFAULT_MODEL_NAME: "llama-3.3-70b-versatile"
  MAX_TOKENS: "4096"
  TEMPERATURE: "0.7"
  
  # Performance Settings
  REQUEST_TIMEOUT: "300"
  MAX_RETRIES: "3"
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_PERIOD: "3600"
  
  # Features Flags
  ENABLE_AZURE_COSMOSDB: "false"
  ENABLE_AZURE_FUNCTIONS: "false"
  ENABLE_SMS_NOTIFICATIONS: "false"
  ENABLE_PUSH_NOTIFICATIONS: "false"
